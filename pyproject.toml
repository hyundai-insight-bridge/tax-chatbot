[project]
name = "tax-chatbot"
version = "0.1.0"
description = ""
authors = [
    {name = "Hyeonsu Ryu",email = "hsoo112149@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain (>=1.4.6,<2.0.0)",
    "langchain-openai (>=1.7.2,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-text-splitters (>=1.1.3,<2.0.0)",
    "langgraph (>=1.2.16,<2.0.0)",
    "pypdf (>=6.21.1,<7.0.0)",
    "faiss-cpu (>=1.15.1,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
requires-poetry = ">=2.0,<3.0"
[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)"
]
